  #langMenu{position:fixed;top:calc(52px + var(--safe-t));right:12px;z-index:31;background:var(--blue);
    border:0;border-radius:16px;padding:8px 6px;display:none;flex-direction:column;
    min-width:150px}
  #langMenu.on{display:flex}
  #langMenu button{border:0;background:none;color:var(--yellow);text-align:left;padding:9px 12px;
    border-radius:10px;font-size:15px;display:flex;gap:9px;align-items:center;font-family:inherit;font-weight:700}
  #langMenu button.sel{background:var(--yellow);color:var(--blue)}
  #langMenu button:nth-child(1){transform:rotate(-3deg)}
  #langMenu button:nth-child(2){transform:rotate(2.5deg)}
  #langMenu button:nth-child(3){transform:rotate(-2deg)}
  #langMenu button:nth-child(4){transform:rotate(3deg)}
  #langMenu button:nth-child(5){transform:rotate(-2.5deg)}
  #langMenu button:nth-child(6){transform:rotate(2deg)}
  #langMenu button:nth-child(7){transform:rotate(-3deg)}

  /* ---- Start overlay ---- */
  #startOverlay{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:60;
    background:var(--yellow);touch-action:none}
  #startOverlay.hidden{display:none}
  #startInner{position:fixed;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;
    padding:calc(18px + var(--safe-t)) 24px calc(18px + var(--safe-b))}
  #startPet{width:min(60vw,272px);height:auto;aspect-ratio:520/633;max-height:33vh;object-fit:contain;margin-top:-18px}
  #heoLogo{width:min(72vw,350px);height:auto;aspect-ratio:780/382;max-height:15vh;object-fit:contain;
    margin-top:-56px;position:relative;z-index:2}
  #startOverlay .intro{margin:8px 0 0;color:#141414;max-width:340px;line-height:1.4;font-size:14px;font-weight:600}
  #startBtn{margin-top:12px;border:0;padding:11px 38px;border-radius:34px;font-size:16px;font-weight:900;
    letter-spacing:.3px;color:var(--yellow);background:var(--blue);
    animation:btnShake 4s ease-in-out infinite}
  #startBtn:active{filter:brightness(1.15)}
  #startCopy{margin-top:14px;text-align:center;color:#141414;font-weight:400;font-size:11px;line-height:1.5}
  #startCopy .ver{opacity:.7}
  #installTip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));
    z-index:62;display:none;align-items:center;gap:11px;width:min(92vw,360px);
    background:var(--blue);color:#fff;border-radius:16px;padding:11px 12px}
  #installTip .ic{flex:0 0 auto;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
  #installTip .ic svg{width:26px;height:26px;display:block}
  #installTip .body{flex:1;min-width:0;text-align:left;line-height:1.35}
  #installTip .body b{display:block;font-size:12.5px;color:var(--yellow);margin-bottom:2px}
  #installTip .body span{font-size:12px}
  #installTip #tipClose{flex:0 0 auto;width:24px;height:24px;border:0;border-radius:50%;
    background:rgba(255,255,255,.22);color:#fff;font-size:12px;line-height:1;
    display:flex;align-items:center;justify-content:center}
  @keyframes btnShake{
    0%,10%,100%{transform:translateX(0)}
    2%{transform:translateX(-6px) rotate(-2deg)} 4%{transform:translateX(6px) rotate(2deg)}
    6%{transform:translateX(-5px) rotate(-1.5deg)} 8%{transform:translateX(5px) rotate(1.5deg)}
  }

  /* ---- Scrim + sheets ---- */
  #scrim{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:45;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s}
  #scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:84vh;color:#141414;
    background:var(--yellow);border-radius:26px 26px 0 0;
    transform:translateY(103%);transition:transform .3s cubic-bezier(.22,1,.36,1);
    display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
  .sheet.open{transform:translateY(0)}
  .grab{width:42px;height:5px;border-radius:3px;background:rgba(0,0,0,.35);margin:9px auto 0}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px}
  .sheet-h h2{margin:0;font-size:20px;color:#141414}
  .sheet-h .x{position:absolute;top:14px;right:14px;z-index:3;
    width:34px;height:34px;border:0;border-radius:50%;background:#141414;color:#fff;
    font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .sheet-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 26px}

  /* ---- Heo info ---- */
  #heoPhoto{width:100%;max-width:340px;margin:0 auto 4px;display:block;border-radius:24px;overflow:hidden;
    background:#fff}
  #heoPhotoWrap{display:flex;justify-content:center}
  .bio{line-height:1.62;color:#1a1a1a;margin:14px 2px 6px;font-size:15px}
  .igCard{display:flex;align-items:center;gap:16px;background:#fff;border:0;
    border-radius:18px;padding:14px;margin:16px 0 6px}
  .igCard .qr{width:96px;height:96px;border-radius:10px;background:#fff;flex:0 0 auto}
  .igCard .qr img{width:100%;height:100%;border-radius:10px;display:block}
  .igCard .igtxt{flex:1;min-width:0;color:#141414}
  .igCard .igtxt b{font-size:15px}
  .igCard .igtxt p{margin:3px 0 10px;color:#555;font-size:13px}
  .igBtn{display:inline-block;border:0;border-radius:30px;padding:10px 18px;font-weight:800;font-size:14px;
    color:#fff;text-decoration:none;background:linear-gradient(135deg,#feda75,#d62976 45%,#962fbf 80%,#4f5bd5)}
  .legal{margin-top:22px;border-top:1px solid rgba(0,0,0,.22);padding-top:16px}
  .legal h3{color:var(--blue);font-size:13px;margin:16px 0 5px;letter-spacing:.4px;
    text-transform:uppercase;font-weight:800}
  .legal h3:first-child{margin-top:0}
  .legal p{color:#2a2a2a;font-size:12.5px;line-height:1.55;margin:0}
  .legal .cp{color:#444;font-size:11.5px;margin-top:14px;text-align:center}
  .legal .ver{color:#555;font-size:11px;font-weight:800;text-align:center;margin-top:3px}
  .legal a{color:var(--blue);text-decoration:underline;font-weight:700}

  /* ---- Treats ---- */
  .sub{color:#333;font-size:13.5px;margin:2px 2px 16px;line-height:1.5}
  #treatGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
  .treat{background:#fff;border:0;border-radius:18px;padding:14px 6px;
    display:flex;flex-direction:column;align-items:center;gap:7px;color:#141414;cursor:pointer}
  .treat .il{width:46px;height:46px;display:flex;align-items:center;justify-content:center}
  .treat .il svg{width:100%;height:100%;display:block}
  .treat small{font-size:11.5px;color:#444;text-align:center;line-height:1.2}
  .treat.sel{background:var(--blue)}
  .treat.sel small{color:var(--yellow)}
  .btn{width:100%;border:0;border-radius:16px;padding:15px;font-size:17px;font-weight:900;
    color:var(--yellow);background:var(--blue)}
  .btn:active{filter:brightness(1.12)}

  /* ---- Photo filter bar ---- */
  #filterBar{position:fixed;left:0;right:0;bottom:0;z-index:44;
    padding:12px 10px calc(12px + var(--safe-b));
    background:linear-gradient(180deg,rgba(20,14,12,0),rgba(20,14,12,.92) 32%);
    backdrop-filter:blur(8px);display:none;flex-direction:column;gap:10px}
  #filterBar.on{display:flex}
  #filterStrip{display:flex;gap:9px;overflow-x:auto;padding:2px 4px 4px;-webkit-overflow-scrolling:touch}
  #filterStrip::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;width:60px;height:60px;border-radius:16px;border:2px solid transparent;
    background:rgba(255,255,255,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:#fff;font-size:9px;font-weight:700}
  .fchip .em{width:30px;height:30px;display:flex;align-items:center;justify-content:center}
  .fchip .em svg{width:100%;height:100%;display:block}
  .fchip.sel{border-color:var(--yellow);background:rgba(255,222,0,.20)}
  #filterActions{display:flex;gap:10px;align-items:center;padding:0 4px}
  #snapBtn{flex:1;border:0;border-radius:40px;padding:15px;font-size:18px;font-weight:900;color:var(--yellow);
    background:var(--blue)}
  #snapBtn:active{transform:scale(.97)}
  #filterClose{border:0;border-radius:40px;width:52px;height:52px;font-size:20px;color:#fff;
    background:rgba(60,42,36,.85)}

  /* ---- Tab bar ---- */
  #tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);
    gap:2px;padding:9px 8px calc(9px + var(--safe-b));background:none}
  #tabbar button{border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;
    gap:5px;padding:4px 2px;border-radius:16px;font-size:11px;font-weight:800;transition:.15s}
  #tabbar button .icimg{width:60px;height:60px;border-radius:50%;object-fit:cover;display:block}
  @keyframes fl1{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(1px,-3px) rotate(-2deg)}}
  @keyframes fl2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-2px,-2px) rotate(2deg)}}
  @keyframes fl3{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(2px,-2px) rotate(-1.5deg)}}
  @keyframes fl4{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-1px,-3px) rotate(1.5deg)}}
  #tabbar button:nth-child(1) .icimg{animation:fl1 3.1s ease-in-out infinite}
  #tabbar button:nth-child(2) .icimg{animation:fl2 3.7s ease-in-out infinite .4s}
  #tabbar button:nth-child(3) .icimg{animation:fl3 3.3s ease-in-out infinite .8s}
  #tabbar button:nth-child(4) .icimg{animation:fl4 4.0s ease-in-out infinite .2s}
  #tabbar button:active{transform:scale(.9)}
  #tabbar.hide{display:none}
  body:not(.started) #tabbar{display:none}

  /* ---- Photo preview + flash ---- */
  #flash{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:70;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:fl .26s ease-out}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  #photoPrev{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:66;background:rgba(12,8,6,.95);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;
    padding-bottom:calc(24px + var(--safe-b))}
  #photoPrev.on{display:flex}
  #photoImg{max-width:100%;max-height:66vh;border-radius:14px}
  #photoPrev .row{display:flex;gap:12px}
  #savePhoto,#photoClose{border:0;border-radius:16px;padding:14px 26px;font-size:15px;font-weight:800;
    text-decoration:none;text-align:center}
  #savePhoto{color:var(--yellow);background:var(--blue);font-weight:900}
  #photoClose{color:var(--ink);background:#2a2a2a}

  /* ---- thrown treat ---- */
  #treatFx{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:22;pointer-events:none;display:flex;align-items:center;justify-content:center}
  .thrown{width:52vw;max-width:340px;height:52vw;max-height:340px;animation:treatThrow .78s ease-in forwards}
  .thrown svg{width:100%;height:100%;display:block}
  @keyframes treatThrow{
    0%{transform:scale(1.5) translateY(18px);opacity:0}
    14%{opacity:1}
    100%{transform:scale(.12) translateY(-46px);opacity:0}
  }

  /* ---- floating hearts ---- */
  #heartFx{position:absolute;top:0;left:0;width:100%;height:100dvh;height:100vh;z-index:20;pointer-events:none;overflow:hidden}
  .fheart{position:absolute;bottom:46%;will-change:transform,opacity;
    animation:rise 2.2s ease-out forwards}
  .fheart svg{width:100%;height:100%;display:block}
  @keyframes rise{
    0%{opacity:0;transform:translate(0,0) scale(.3)}
    14%{opacity:1}
    100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,-260px)) scale(1.5)}
  }
</style>

<body>
<div id="app">
  <video id="cam" playsinline muted autoplay webkit-playsinline></video>
  <div id="camMsg"></div>

  <div id="fxLayer">
    <svg id="heartMask" style="display:none" preserveAspectRatio="none"></svg>
  </div>
  <div id="heartFx"></div>
  <div id="treatFx"></div>
  <div id="fxHint"></div>

  <button id="langBtn"><span class="globe"></span><span id="langCur">EN</span></button>
  <div id="langMenu"></div>

  <!-- START -->

        var b2 = read();

        if (c < 128) {

  const DOTS_SVG  = '<svg viewBox="0 0 24 24" fill="#FFDE00"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>';

  const $ = id => document.getElementById(id);
  const tr = () => T[lang] || T.en;

  /* ---------------- audio (disabled — no click sound) ---------------- */
  let actx = null;
  function initAudio(){}
  function blip(){}
  function _blipOld(){
    if(!actx) return;
    if(actx.state==='suspended') actx.resume();
    const now = actx.currentTime;
    [[880,0],[1320,0.09]].forEach(([f,d])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, now+d);
      g.gain.exponentialRampToValueAtTime(0.16, now+d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now+d+0.18);
      o.connect(g).connect(actx.destination);
      o.start(now+d); o.stop(now+d+0.2);
    });
  }

  /* ---------------- QR ---------------- */
  function qrURL(data, size){
    try{ const q=qrcode(0,'M'); q.addData(data); q.make(); return q.createDataURL(size||6,2); }
    catch(e){ return null; }
  }
  let appQR = null;

  /* ---------------- camera ---------------- */
  const video = $('cam');
  async function startCamera(){
    try{
      const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
      video.srcObject = s; await video.play();
    }catch(e){
      document.body.classList.add('no-cam');
    }
  }

  /* ---------------- boot ---------------- */
  $('startBtn').addEventListener('click', boot);
  async function boot(){
    initAudio(); blip();
    document.body.classList.add('started');
    $('startOverlay').classList.add('hidden');
    await startCamera();
  }

  /* ---------------- language ---------------- */
  function buildLangMenu(){
    const m = $('langMenu'); m.innerHTML='';
    LANGS.forEach(L=>{
      const b=document.createElement('button');
      b.className = L.c===lang?'sel':'';
      b.innerHTML = `<span>${L.n}</span>`;
      b.addEventListener('click',()=>{ lang=L.c; applyLang(); m.classList.remove('on'); blip(); });
      m.appendChild(b);
    });
  }
  $('langBtn').addEventListener('click',(e)=>{ e.stopPropagation(); $('langMenu').classList.toggle('on'); });

  function buildFilterStrip(){
    const s=$('filterStrip'); s.innerHTML='';
    FILTERS.forEach(f=>{
      const b=document.createElement('button');
      b.className='fchip'+(f===activeFilter?' sel':'');
      b.innerHTML=`<span class="em">${FILTER_ART[f]}</span><span>${tr().filters[f]}</span>`;
      b.addEventListener('click',()=>{ blip(); setFilter(f); });
      s.appendChild(b);
    });
  }

  function enterPhoto(){
    $('filterBar').classList.add('on');
    $('tabbar').classList.add('hide');
    $('fxLayer').classList.add('active');
    if(activeFilter==='none') setFilter('heart'); else setFilter(activeFilter);
  }
  function exitPhoto(){
    $('filterBar').classList.remove('on');
    $('tabbar').classList.remove('hide');
    $('fxLayer').classList.remove('active');
    clearFx();
    $('fxHint').classList.remove('on');
  }
  $('filterClose').addEventListener('click',()=>{ blip(); exitPhoto(); });

  function clearFx(){
    if(sticker){ sticker.el.remove(); sticker=null; }
    $('heartMask').style.display='none';
  }

  function setFilter(f){
    activeFilter=f;
    clearFx();
    document.querySelectorAll('#filterStrip .fchip').forEach((c,i)=>c.classList.toggle('sel',FILTERS[i]===f));
    if(f==='heart'){ drawHeartMask(); showHint(tr().hintHeart); }
    else if(STICKER_META[f]){ addSticker(f); showHint(tr().hintDrag); }
    else { showHint(''); }
  }

  let hintTimer=null;
  function showHint(txt){
    const h=$('fxHint');
    if(!txt){ h.classList.remove('on'); return; }
    h.textContent=txt; h.classList.add('on');
    clearTimeout(hintTimer); hintTimer=setTimeout(()=>h.classList.remove('on'),2600);
  }

  /* ---- heart frame (dark outside, transparent heart) ---- */
  function heartPathPoints(cx,cy,scale){
    const pts=[];
    for(let i=0;i<=60;i++){
      const t=i/60*Math.PI*2;
      const x=16*Math.pow(Math.sin(t),3);
      const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
      pts.push([cx+x*scale, cy-y*scale]);
    }
    return pts;
  }
  function heartPathD(cx,cy,scale){
    const p=heartPathPoints(cx,cy,scale);
    return 'M'+p.map(a=>a[0].toFixed(1)+' '+a[1].toFixed(1)).join(' L')+' Z';
  }
  function drawHeartMask(){
    const w=innerWidth,h=innerHeight;
    const cx=w/2, cy=h*0.46;
    const scale=Math.min(w,h)*0.028;
    const svg=$('heartMask');
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.setAttribute('width',w); svg.setAttribute('height',h);
    const d=`M0 0 H${w} V${h} H0 Z `+heartPathD(cx,cy,scale);
    svg.innerHTML=`<path d="${d}" fill="#FFDE00" fill-rule="evenodd"/>`;
    svg.style.display='block';
  }

  /* ---- draggable / pinchable / rotatable sticker ---- */
  const MIN_HIT = 90;   // min touch target so tiny stickers stay grabbable
  function addSticker(f){
    const meta=STICKER_META[f];
    const wrap=document.createElement('div');
    wrap.className='sticker';
    const img=document.createElement('img');
    img.className='simg'; img.src=meta.url; img.alt='';
    wrap.appendChild(img);
    $('fxLayer').appendChild(wrap);
    const w=innerWidth*meta.w;
    sticker={ el:wrap, img:img, x:innerWidth*0.5, y:innerHeight*meta.y, scale:1, rot:0, baseW:w, aspect:(meta.h||0.6) };
    layoutSticker();
    // desktop drag fallback (touching the item)
    wrap.addEventListener('mousedown',e=>{ const bx=sticker.x,by=sticker.y,sx=e.clientX,sy=e.clientY;
      const mv=ev=>{ sticker.x=bx+(ev.clientX-sx); sticker.y=by+(ev.clientY-sy); layoutSticker(); };
      const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
    });
  }
  function layoutSticker(){
    if(!sticker) return;
    const s=sticker;
    const vw=s.baseW*s.scale, vh=vw*s.aspect;
    const hit=Math.max(vw, vh, MIN_HIT);
    s.el.style.left='0'; s.el.style.top='0';
    s.el.style.width=hit+'px';
    s.el.style.height=hit+'px';
    s.el.style.transformOrigin='center center';
    s.el.style.transform=`translate3d(${s.x}px,${s.y}px,0) translate(-50%,-50%) rotate(${s.rot}deg)`;
    s.img.style.width=vw+'px';
    s.img.style.height=vh+'px';
  }

  /* Whole-screen gesture handling for the active sticker:
     - 1 finger: drag ONLY if it starts on the item
     - 2 fingers: rotate + zoom (and move) from ANYWHERE on screen */
  (function stickerGestures(){
    const layer=$('fxLayer');
    let count=0, mode=null, sCx=0,sCy=0,sDist=0,sAng=0, bX=0,bY=0,bScale=1,bRot=0;
    const list=e=>Array.from(e.touches);
    const cen=ts=>{let x=0,y=0;ts.forEach(t=>{x+=t.clientX;y+=t.clientY;});return{x:x/ts.length,y:y/ts.length};};
    const dis=ts=>Math.hypot(ts[0].clientX-ts[1].clientX,ts[0].clientY-ts[1].clientY);
    const ang=ts=>Math.atan2(ts[1].clientY-ts[0].clientY,ts[1].clientX-ts[0].clientX)*180/Math.PI;
    function rebase(ts){
      count=ts.length;
      const c=cen(ts); sCx=c.x; sCy=c.y;
      bX=sticker.x; bY=sticker.y; bScale=sticker.scale; bRot=sticker.rot;
      if(ts.length>=2){ sDist=dis(ts)||1; sAng=ang(ts); }
    }
    layer.addEventListener('touchstart',e=>{
      if(!sticker) return;
      const ts=list(e);
      if(ts.length>=2){ mode='xform'; e.preventDefault(); rebase(ts); }
      else if(ts.length===1 && sticker.el.contains(e.target)){ mode='drag'; e.preventDefault(); rebase(ts); }
      else { mode=null; }
    },{passive:false});
    layer.addEventListener('touchmove',e=>{
      if(!sticker||!mode) return;
      const ts=list(e); if(!ts.length) return;
      e.preventDefault();
      if(ts.length!==count){ mode = ts.length>=2 ? 'xform' : 'drag'; rebase(ts); }
      const c=cen(ts);
      sticker.x=bX+(c.x-sCx);
      sticker.y=bY+(c.y-sCy);
      if(mode==='xform' && ts.length>=2){
        sticker.scale=Math.max(0.3,Math.min(4, bScale*(dis(ts)/sDist)));
        sticker.rot=bRot+(ang(ts)-sAng);
      }
      layoutSticker();
    },{passive:false});
    const end=e=>{ const ts=list(e); if(!ts.length){ mode=null; } else { mode = ts.length>=2?'xform':'drag'; rebase(ts); } };
    layer.addEventListener('touchend',end,{passive:false});
    layer.addEventListener('touchcancel',end,{passive:false});
  })();

  window.addEventListener('resize',()=>{ if(activeFilter==='heart' && $('filterBar').classList.contains('on')) drawHeartMask(); });

  /* ---- snap ---- */
  $('snapBtn').addEventListener('click',()=>{ blip(); takePhoto(); });

  function takePhoto(){
    const W=1080, H=1920;                 // vertical 9:16 (Instagram / TikTok)
    const cv=document.createElement('canvas');
    cv.width=W; cv.height=H;
    const cx=cv.getContext('2d');

    // camera cover-cropped to 9:16
    if(video.videoWidth){
      const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
      const dw=vw*s, dh=vh*s;
      cx.drawImage(video,(W-dw)/2,(H-dh)/2,dw,dh);
    } else {
      cx.fillStyle='#FFDE00'; cx.fillRect(0,0,W,H);
    }

    // filter overlay
    if(activeFilter==='heart'){
      const off=document.createElement('canvas'); off.width=W; off.height=H;
      const ox=off.getContext('2d');
      ox.fillStyle='#FFDE00'; ox.fillRect(0,0,W,H);
      const cxh=W/2, cyh=H*0.42, sc=W*0.030;
      ox.globalCompositeOperation='destination-out';
      const pts=heartPathPoints(cxh,cyh,sc);
      ox.beginPath(); ox.moveTo(pts[0][0],pts[0][1]);
      pts.forEach(p=>ox.lineTo(p[0],p[1])); ox.closePath(); ox.fill();
      ox.globalCompositeOperation='source-over';
      cx.drawImage(off,0,0);
    } else if(sticker){
      const cam=video.getBoundingClientRect();
      const vw=video.videoWidth, vh=video.videoHeight;
      const curW=sticker.baseW*sticker.scale;
      let px, py, dw;
      if(vw && vh && cam.width && cam.height){
        // map to actual camera content (cover-fit on screen -> cover-fit in photo)
        const ss=Math.max(cam.width/vw, cam.height/vh);
        const dvw=vw*ss, dvh=vh*ss, oxs=(cam.width-dvw)/2, oys=(cam.height-dvh)/2;
        const u=((sticker.x-cam.left)-oxs)/dvw;
        const v=((sticker.y-cam.top)-oys)/dvh;
        const sp=Math.max(W/vw, H/vh);
        const dpw=vw*sp, dph=vh*sp, oxp=(W-dpw)/2, oyp=(H-dph)/2;
        px=oxp+u*dpw; py=oyp+v*dph; dw=curW*(sp/ss);
      } else {
        px=(sticker.x/innerWidth)*W; py=(sticker.y/innerHeight)*H; dw=curW*(W/innerWidth);
      }
      const dh=dw*sticker.aspect;
      cx.save();
      cx.translate(px, py);
      cx.rotate(sticker.rot*Math.PI/180);
      cx.drawImage(sticker.img, -dw/2, -dh/2, dw, dh);
      cx.restore();
    }

    // footer band (inside the 9:16 frame)
    const foot=Math.round(H*0.095);
    cx.fillStyle='#000CFF'; cx.fillRect(0,H-foot,W,foot);
    const pad=foot*0.16, qs=foot-pad*2, tx=pad*2+qs;
    const finish=()=>{
      cx.textBaseline='middle'; cx.textAlign='left';
      cx.fillStyle='#FFDE00';
      cx.font=`900 ${Math.round(foot*0.34)}px system-ui, sans-serif`;
      cx.fillText('Heo', tx, H-foot+foot*0.38);
      cx.fillStyle='#ffffff';
      cx.font=`600 ${Math.round(foot*0.22)}px system-ui, sans-serif`;
      cx.fillText(COPY, tx, H-foot+foot*0.72);
      exportPhoto(cv);
    };
    if(appQR){
      const im=new Image();
      im.onload=()=>{ cx.drawImage(im,pad,H-foot+pad,qs,qs); finish(); };
      im.onerror=finish; im.src=appQR;
    } else finish();
  }

  function flash(){ const f=$('flash'); f.classList.add('on'); setTimeout(()=>f.classList.remove('on'),260); }

  function exportPhoto(cv){
    flash();
    cv.toBlob(async(blob)=>{
      const url=URL.createObjectURL(blob);
      const file=new File([blob],'heo.png',{type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{ await navigator.share({files:[file],title:'Heo',text:'Heo · '+COPY}); URL.revokeObjectURL(url); return; }
        catch(e){ /* cancelled -> preview */ }
      }
      showPreview(url);
    },'image/png');
  }
  function showPreview(url){
    $('photoImg').src=url;
    const a=$('savePhoto'); a.href=url; a.download='heo.png';
    $('photoPrev').classList.add('on');
  }
  $('photoClose').addEventListener('click',()=>$('photoPrev').classList.remove('on'));

  /* ---------------- manifest (runtime, single-file) ---------------- */
  function buildManifest(){
    try{
      const icon = document.querySelector('link[rel="apple-touch-icon"]').href;
      const man = {
        name:'Heo', short_name:'Heo', start_url:'./', scope:'./',
        display:'standalone', background_color:'#FFDE00', theme_color:'#FFDE00',
        description:'Meet Heo, the tiny white chihuahua of Saigon.',
        icons:[
          { src:icon, sizes:'180x180', type:'image/png', purpose:'any maskable' },
          { src:icon, sizes:'512x512', type:'image/png', purpose:'any maskable' }
        ]
      };
      const blob=new Blob([JSON.stringify(man)],{type:'application/manifest+json'});
      $('manifestLink').href=URL.createObjectURL(blob);
    }catch(e){}
  }

  /* ---------------- init ---------------- */
  /* ---- lock page scroll everywhere; allow only real scroll areas ---- */
  document.addEventListener('touchmove', function(e){
    if(e.target.closest && e.target.closest('.sheet-body, #filterStrip')) return;  // inner scroll ok
    e.preventDefault();
  }, {passive:false});

  appQR = qrURL(APP_URL,6);
  applyLang();
  syncHeoHeight();
  window.addEventListener('resize', syncHeoHeight);

  /* ---- install tip: first visit only, right device, not already installed ---- */
  (function installTip(){
    const tip=$('installTip'); if(!tip) return;
    $('tipClose') && $('tipClose').addEventListener('click',()=>{ tip.style.display='none'; });
    try{
      const v=parseInt(localStorage.getItem('heo_visits')||'0',10);
      if(v<1 && !isStandalone && (isIOS||isAndroid)) tip.style.display='flex';
      localStorage.setItem('heo_visits', String(v+1));
    }catch(e){ /* private mode: just skip */ }
  })();

})();

</script>
